name: Vava
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  schemePathPrefix: "../../"
packages:
  TPInAppReceipt:
    url: https://github.com/tikhop/TPInAppReceipt.git
    exactVersion: 4.0.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
fileGroups:
  - Configuration
  - Assets/Design
  - Assets/AgreementSources
  - Assets/Agreements
targets:
  Vava:
    type: application
    platform: iOS
    dependencies:
      - package: TPInAppReceipt
      - sdk: StoreKit.framework
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Configuration
        includes:
          - "coin-products.json"
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Assets/Assets.xcassets
      - path: Assets/Licenses
        type: folder
        buildPhase: resources
      - path: Assets/Fonts
        buildPhase: resources
      - path: Assets/Content/catalog.json
        buildPhase: resources
      - path: Assets/Content/Media
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Vava
        PRODUCT_BUNDLE_IDENTIFIER: com.vava.pingpong
        DEVELOPMENT_TEAM: JPTS6M4T5B
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: im.seex.sao2
schemes:
  Vava:
    build:
      targets:
        Vava: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/VavaCoins.storekit
      environmentVariables:
        VAVA_LOCAL_STOREKIT: "1"
    archive:
      config: Release
